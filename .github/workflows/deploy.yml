name: nabtiq-deploy
# Deploy is a CI + EVENTS flow, NOT a capability skill (Rev 2 primitive #6 vs #2).
# It re-runs the full gate chain, then enforces the Wave-5 release/live gates, and only
# THEN would a real deploy step run. The authenticated deployment-authorization event
# (issuer != author, role owner/release-manager) is what deploy_readiness.py verifies —
# a human approval, cryptographically bound, not something this workflow can self-grant.
on:
  workflow_dispatch:
    inputs:
      project:
        description: "project dir under projects/ to deploy"
        required: true
        default: "demo-fixed"
      domain:
        description: "public host to publish to (Traefik router), e.g. test.nabtiq.com"
        required: true
        default: "test.nabtiq.com"
permissions:
  contents: read
jobs:
  deploy-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Full gate chain must PASS (incl. deploy_readiness / live_verify / monitoring)
        run: bash scripts/run-checks.sh "projects/${{ github.event.inputs.project }}"
      - name: Deploy-readiness gate (rollback + authenticated deployment-authorization event)
        run: python3 probes/deploy_readiness.py "projects/${{ github.event.inputs.project }}"

  deploy:
    needs: deploy-gate
    runs-on: ubuntu-latest
    # A real environment lets you require a second human "environment protection" approval
    # in GitHub before this job runs — layered on top of the in-repo authorization event.
    environment: production
    permissions:
      contents: read
      id-token: write        # OIDC identity of the deploy run (for provider auth / attestation)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      # Real deploy to the Traefik VPS. Runs only when the VPS secrets are configured, so the
      # workflow never fails for a fork without infra. Set once (you handle credentials):
      #   secret VPS_SSH_KEY        (private deploy key authorized on the VPS)
      #   secret VPS_SSH_TARGET     e.g. deploy@45.9.188.149
      #   secret VPS_KNOWN_HOSTS    output of: ssh-keyscan 45.9.188.149
      #   var    TRAEFIK_CERTRESOLVER  Traefik ACME resolver name (this VPS: letsencrypt)
      - name: Deploy to Traefik VPS (static site, auto Let's Encrypt)
        if: ${{ secrets.VPS_SSH_KEY != '' }}
        env:
          VPS_SSH_TARGET: ${{ secrets.VPS_SSH_TARGET }}
          SITE_DOMAIN: ${{ github.event.inputs.domain }}
          TRAEFIK_CERTRESOLVER: ${{ vars.TRAEFIK_CERTRESOLVER }}
          PROJECT_DIR: projects/${{ github.event.inputs.project }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gettext-base rsync
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"; ssh-add ~/.ssh/id_deploy
          bash scripts/deploy_vps.sh
      - name: No VPS secrets — deploy skipped (gates still enforced)
        if: ${{ secrets.VPS_SSH_KEY == '' }}
        run: |
          echo "::notice::VPS_SSH_KEY not set — real deploy skipped. Gates + deploy-readiness passed."
          echo "Set VPS_SSH_KEY / VPS_SSH_TARGET / VPS_KNOWN_HOSTS + var TRAEFIK_CERTRESOLVER (letsencrypt) to enable."
      - name: Post-deploy live verification gate
        run: python3 probes/live_verify.py "projects/${{ github.event.inputs.project }}"
      - name: Monitoring must be ARMED after deploy
        run: python3 probes/monitoring_state_check.py "projects/${{ github.event.inputs.project }}"
