# Per-site static container behind the VPS's existing Traefik (auto Let's Encrypt SSL).
# One of these is generated per deployed domain by scripts/deploy_vps.sh.
#
# Matches THIS VPS's proven pattern (verified on the live box): Traefik runs in HOST network
# mode and reaches each site over that site's OWN per-compose bridge network — there is NO shared
# external Traefik network. So we let compose create this site's default private network and add
# NO `traefik.docker.network` label (the container is on exactly one network, so none is needed),
# exactly like every live site already on the server. Traefik does a global HTTP→HTTPS redirect,
# so no per-site redirect labels either.
#
# Injected from the environment (see the runbook):
#   SITE_SERVICE          unique service/router name, e.g. test-nabtiq-com
#   SITE_DOMAIN           the public host, e.g. test.nabtiq.com
#   TRAEFIK_CERTRESOLVER  the Traefik ACME resolver name (this VPS: letsencrypt)
services:
  ${SITE_SERVICE}:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./site:/usr/share/nginx/html:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${SITE_SERVICE}.rule=Host(`${SITE_DOMAIN}`)"
      - "traefik.http.routers.${SITE_SERVICE}.entrypoints=websecure"
      - "traefik.http.routers.${SITE_SERVICE}.tls=true"
      - "traefik.http.routers.${SITE_SERVICE}.tls.certresolver=${TRAEFIK_CERTRESOLVER}"
      - "traefik.http.services.${SITE_SERVICE}.loadbalancer.server.port=80"
    # No `networks:` block on purpose — compose creates <project>_default (this site's own
    # private bridge), which host-mode Traefik reaches. This isolates the site from every other.
